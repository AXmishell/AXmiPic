server:
  host: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8080"
  # Only enable when running behind a trusted reverse proxy: when true, the
  # client IP is taken from X-Forwarded-For / X-Real-IP. Leaving it false
  # prevents clients from spoofing those headers to bypass IP rate limits.
  trust_proxy: false
  read_timeout_sec: 30
  write_timeout_sec: 30
  shutdown_timeout_sec: 10

database:
  driver: "sqlite"
  dsn: "./data/axmipic.db"

storage:
  # driver: local | s3 | qiniu
  driver: "local"
  local:
    root: "./data/uploads"
  # S3-compatible backend (AWS S3 / MinIO / Cloudflare R2 / Aliyun OSS / Tencent COS)
  s3:
    endpoint: "https://s3.amazonaws.com"
    region: "us-east-1"
    bucket: "axmipic"
    access_key_id: ""
    secret_access_key: ""
    secure: true
    use_path_style: false
    public_base_url: ""
    presign_expiry_sec: 900
  # Qiniu Kodo backend
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: "axmipic"
    domain: "https://cdn.example.com"
    upload_host: ""
    zone: ""
    private: false
    use_https: true
    presign_expiry_sec: 3600

upload:
  max_size_mb: 20
  allowed_mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"

processing:
  enabled: true
  max_width: 4096
  max_height: 4096
  default_quality: 82
  allowed_formats:
    - "jpeg"
    - "png"
    - "gif"
    - "webp"
    - "avif"

auth:
  # Leave empty to auto-generate a random secret at startup (sessions reset on restart).
  jwt_secret: ""
  session_ttl_hours: 24
  allow_registration: true
  # When true, only authenticated users may upload; guests are rejected.
  require_auth: true
  # Per-user storage quota in MiB; 0 means unlimited.
  default_quota_mb: 1024
  # Optional "username:password" seeded as an admin only when no users exist.
  bootstrap_admin: ""

limits:
  upload_per_minute: 30
  upload_burst: 5
  guest_per_minute: 6
  guest_burst: 2
  # Per-IP limit for public image serving and on-the-fly transformation.
  image_per_minute: 600
  image_burst: 120

logging:
  level: "info"
