server:
  host: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8080"
  read_timeout_sec: 30
  write_timeout_sec: 30
  shutdown_timeout_sec: 10

database:
  driver: "sqlite"
  dsn: "./data/axmipic.db"

storage:
  # driver: local | s3 | qiniu
  driver: "local"
  local:
    root: "./data/uploads"
  # S3-compatible backend (AWS S3 / MinIO / Cloudflare R2 / Aliyun OSS / Tencent COS)
  s3:
    endpoint: "https://s3.amazonaws.com"
    region: "us-east-1"
    bucket: "axmipic"
    access_key_id: ""
    secret_access_key: ""
    secure: true
    use_path_style: false
    public_base_url: ""
    presign_expiry_sec: 900
  # Qiniu Kodo backend
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: "axmipic"
    domain: "https://cdn.example.com"
    upload_host: ""
    zone: ""
    private: false
    use_https: true
    presign_expiry_sec: 3600

upload:
  max_size_mb: 20
  allowed_mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"

logging:
  level: "info"
