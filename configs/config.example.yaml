server:
  host: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8080"
  # Only enable when running behind a trusted reverse proxy: when true, the
  # client IP is taken from X-Forwarded-For / X-Real-IP. Leaving it false
  # prevents clients from spoofing those headers to bypass IP rate limits.
  trust_proxy: false
  read_timeout_sec: 30
  write_timeout_sec: 30
  shutdown_timeout_sec: 10

database:
  # driver: sqlite | postgres
  driver: "sqlite"
  # For sqlite: a file path. For postgres: a libpq DSN or URL, e.g.
  #   host=127.0.0.1 port=5432 user=axmipic password=secret dbname=axmipic sslmode=disable
  #   postgres://axmipic:secret@127.0.0.1:5432/axmipic?sslmode=disable
  dsn: "./data/axmipic.db"

storage:
  # driver: local | s3 | qiniu
  driver: "local"
  local:
    root: "./data/uploads"
  # S3-compatible backend (AWS S3 / MinIO / Cloudflare R2 / Aliyun OSS / Tencent COS)
  s3:
    endpoint: "https://s3.amazonaws.com"
    region: "us-east-1"
    bucket: "axmipic"
    access_key_id: ""
    secret_access_key: ""
    secure: true
    use_path_style: false
    public_base_url: ""
    presign_expiry_sec: 900
  # Qiniu Kodo backend
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: "axmipic"
    domain: "https://cdn.example.com"
    upload_host: ""
    zone: ""
    private: false
    use_https: true
    presign_expiry_sec: 3600

upload:
  max_size_mb: 20
  allowed_mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"

processing:
  # Image processing driver: purego | libvips | magick. libvips requires a
  # -tags libvips (CGO) build; magick uses the ImageMagick CLI. Unknown or
  # unavailable drivers fall back to purego at startup.
  driver: "purego"
  enabled: true
  max_width: 4096
  max_height: 4096
  default_quality: 82
  allowed_formats:
    - "jpeg"
    - "png"
    - "gif"
    - "webp"
    - "avif"
  # Allow enlarging beyond the source size (default false).
  allow_enlarge: false
  # Allow grayscale / blur / sharpen filters.
  allow_effects: true
  # Allow text watermarks requested via URL.
  allow_watermark: true
  # When non-empty, this watermark is always applied.
  watermark_text: ""

auth:
  # Leave empty to auto-generate a persisted secret on first run (stored next
  # to the SQLite database, or under ./data). Set it explicitly in production
  # and for multi-instance deployments.
  jwt_secret: ""
  # Optional master key used only to encrypt stored storage-backend secrets.
  # Falls back to jwt_secret when empty; both are empty-safe thanks to the
  # persisted auto-generated key.
  encryption_key: ""
  session_ttl_hours: 24
  allow_registration: true
  # When true, only authenticated users may upload; guests are rejected.
  require_auth: true
  # Per-user storage quota in MiB; 0 means unlimited.
  default_quota_mb: 1024
  # Optional "username:password" seeded as an admin when the admins table is
  # empty. Manage admins separately from ordinary users via /admin/.
  bootstrap_admin: ""
  # Allow anonymous guests to upload using the restricted Guest role group.
  allow_guest_upload: true
  # Guest role limits (MiB). 0 means unlimited quota.
  guest_quota_mb: 64
  guest_upload_max_mb: 5
  # 单个客户端 IP 在 24 小时窗口内的访客累计上传总量（MiB）。0 表示不限。
  # 用于防止通过反复更换访客 cookie 绕过每访客配额。
  guest_ip_quota_mb: 512

install:
  # When this lock file exists the instance is considered installed. Remove it
  # (and the database) to re-run the setup wizard at /install.
  lock_file: "./data/install.lock"
  # Config file rewritten by the setup wizard.
  config_path: "./configs/config.yaml"
  # Setup-wizard authorization token. Leave empty to have the server generate a
  # random token at startup (printed to the logs) that must be entered on the
  # install page.
  token: ""
  # Skip the install check entirely (useful for tests / orchestration).
  disabled: false

limits:
  upload_per_minute: 30
  upload_burst: 5
  guest_per_minute: 6
  guest_burst: 2
  # Per-IP limit for public image serving and on-the-fly transformation.
  image_per_minute: 600
  image_burst: 120
  # Per-IP limit for share access (password checks), to prevent brute force.
  share_per_minute: 30
  share_burst: 10

payment:
  # Default payment gateway: manual | mock | alipay | wechat | epay
  default_gateway: "manual"
  # Alipay 当面付（扫码支付）。启用需填写 app_id、private_key、public_key。
  alipay:
    enabled: false
    # Leave empty for the production gateway.
    gateway_url: ""
    app_id: ""
    # 应用私钥（PKCS1/PKCS8，PEM 或裸 base64）。
    private_key: ""
    # 支付宝公钥，用于校验异步通知签名。
    public_key: ""
  # 微信支付 v3（Native 扫码）。启用需填写 app_id、mch_id、serial_no、
  # private_key、api_v3_key。
  wechat:
    enabled: false
    gateway_url: ""
    app_id: ""
    mch_id: ""
    serial_no: ""
    private_key: ""
    # APIv3 密钥（32 字节），用于解密回调。
    api_v3_key: ""
    # 微信支付平台证书公钥（PEM 或裸 base64）；**必填**，用于对回调
    # Wechatpay-Signature 做 RSA 验签，缺失时微信渠道将拒绝构造。
    platform_public_key: ""
    # 平台证书序列号；配置后校验回调头中的 serial。
    platform_serial_no: ""
  # 易支付（彩虹易支付兼容）聚合支付。启用需填写 pid、key、gateway_url。
  epay:
    enabled: false
    # 商户号与密钥（MD5 签名）。
    pid: ""
    key: ""
    # 站点根地址，例如 https://pay.example.com
    gateway_url: ""
    # 自定义下单/收银台地址；留空分别使用 <gateway_url>/mapi.php 与
    # <gateway_url>/submit.php。
    api_url: ""
    submit_url: ""
    # 支付通道：alipay、wxpay、qqpay 等；留空默认 alipay。
    pay_type: "alipay"

security:
  # Upload content scanner: none | builtin
  scanner: "builtin"
  # Image cloud processor: local (uses the built-in imaging pipeline)
  cloud_processor: "local"

sms:
  # Enable a generic HTTP SMS gateway. Params are not templated here; the
  # gateway is contacted with to/body placeholders when enabled in code.
  enabled: false
  provider: ""
  endpoint: ""
  method: "POST"

email:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
  use_tls: false

logging:
  level: "info"
