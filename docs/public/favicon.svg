<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AXmiPic 图床">
  <title>AXmiPic 图床</title>
  <defs>
    <linearGradient id="axmipic-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#828fff" />
      <stop offset="1" stop-color="#5e6ad2" />
    </linearGradient>
    <clipPath id="axmipic-front">
      <rect x="8.5" y="9.5" width="16.5" height="16.5" rx="4.2" />
    </clipPath>
  </defs>
  <!-- 深色底：与应用 #0f1011 一致 -->
  <rect width="32" height="32" rx="8" fill="#0f1011" />
  <!-- 后一张照片：倾斜叠放，形成图库/图床的层次 -->
  <rect
    x="8.5" y="9.5" width="16.5" height="16.5" rx="4.2"
    fill="url(#axmipic-g)" opacity="0.45"
    transform="rotate(-13 16.75 17.75)" />
  <!-- 前一张照片：山峦与太阳，代表被托管的图片 -->
  <g clip-path="url(#axmipic-front)">
    <rect x="8.5" y="9.5" width="16.5" height="16.5" fill="url(#axmipic-g)" />
    <circle cx="20.6" cy="14" r="2.1" fill="#f7f8f8" />
    <path d="M6.5 27 L13.6 18.2 L17.2 22.2 L19.2 19.8 L27 27 Z" fill="#0f1011" />
  </g>
  <!-- 前后照片之间的分隔 -->
  <rect
    x="9.25" y="10.25" width="15" height="15" rx="3.5"
    fill="none" stroke="#0f1011" stroke-width="1.3" />
</svg>
